<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SmartInject - Duplicar Relatório de Ensaio</title>
<style>
:root {
  --bg: #F6F3EE;
  --surface: #FFFFFF;
  --surface-alt: #EDE8E0;
  --border: #DBD3C7;
  --text: #211E1A;
  --text-muted: #6B6459;
  --accent: #B45A17;
  --accent-contrast: #FFFFFF;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1B1917;
    --surface: #242220;
    --surface-alt: #2C2925;
    --border: #3C3833;
    --text: #EDE8E0;
    --text-muted: #A79E90;
    --accent: #E08A3E;
    --accent-contrast: #1B1917;
  }
}
:root[data-theme="dark"] {
  --bg: #1B1917; --surface: #242220; --surface-alt: #2C2925; --border: #3C3833;
  --text: #EDE8E0; --text-muted: #A79E90; --accent: #E08A3E; --accent-contrast: #1B1917;
}
:root[data-theme="light"] {
  --bg: #F6F3EE; --surface: #FFFFFF; --surface-alt: #EDE8E0; --border: #DBD3C7;
  --text: #211E1A; --text-muted: #6B6459; --accent: #B45A17; --accent-contrast: #FFFFFF;
}
* { box-sizing: border-box; }
body { margin: 0; }
.app {
  font-family: system-ui, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
.top {
  position: sticky;
  top: 0;
  z-index: 5;
  background: var(--bg);
  padding: 20px 20px 14px;
  border-bottom: 1px solid var(--border);
}
.title {
  font-size: 1.05rem;
  font-weight: 700;
  letter-spacing: 0.01em;
  margin: 0 0 12px;
}
.title .sub {
  display: block;
  font-size: 0.8rem;
  font-weight: 500;
  color: var(--text-muted);
  margin-top: 2px;
}
.search {
  width: 100%;
  font-size: 1.15rem;
  padding: 16px 18px;
  border-radius: 12px;
  border: 1.5px solid var(--border);
  background: var(--surface);
  color: var(--text);
  outline: none;
}
.search:focus { border-color: var(--accent); }
.count {
  margin-top: 10px;
  font-size: 0.8rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.list {
  flex: 1;
  overflow-y: auto;
  padding: 12px 16px 32px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.card {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 16px 18px;
  border-radius: 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  text-decoration: none;
  color: var(--text);
  transition: border-color 0.12s ease, transform 0.08s ease;
}
.card:active { transform: scale(0.99); border-color: var(--accent); background: var(--surface-alt); }
.card-main { flex: 1; min-width: 0; }
.card-tag {
  display: inline-block;
  font-family: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Consolas, monospace;
  font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: 0.03em;
  color: var(--accent);
  border: 1px solid var(--accent);
  border-radius: 6px;
  padding: 1px 6px;
  margin-bottom: 6px;
}
.card-id {
  font-family: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Consolas, monospace;
  font-size: 1.15rem;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.card-meta {
  margin-top: 4px;
  font-size: 0.82rem;
  color: var(--text-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.card-cta {
  flex-shrink: 0;
  font-size: 0.85rem;
  font-weight: 700;
  color: var(--accent-contrast);
  background: var(--accent);
  padding: 10px 16px;
  border-radius: 10px;
  white-space: nowrap;
}
.empty {
  text-align: center;
  color: var(--text-muted);
  padding: 60px 20px;
  font-size: 0.95rem;
}
.gate {
  position: fixed;
  inset: 0;
  background: var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  z-index: 10;
}
.gate-box {
  width: 100%;
  max-width: 320px;
  text-align: center;
}
.gate-box h2 {
  font-family: system-ui, "Segoe UI", Roboto, sans-serif;
  font-size: 1rem;
  font-weight: 700;
  color: var(--text);
  margin: 0 0 16px;
}
.gate-input {
  width: 100%;
  font-size: 1.4rem;
  letter-spacing: 0.3em;
  text-align: center;
  padding: 14px;
  border-radius: 12px;
  border: 1.5px solid var(--border);
  background: var(--surface);
  color: var(--text);
  outline: none;
  font-variant-numeric: tabular-nums;
}
.gate-input.erro { border-color: #B3261E; }
.gate-btn {
  margin-top: 12px;
  width: 100%;
  font-size: 1rem;
  font-weight: 700;
  color: var(--accent-contrast);
  background: var(--accent);
  border: none;
  padding: 14px;
  border-radius: 12px;
}
.gate-erro {
  margin-top: 10px;
  font-size: 0.82rem;
  color: #B3261E;
  min-height: 1.2em;
}
.hidden { display: none !important; }
</style>
</head>
<body>

<div id="gate" class="gate">
  <div class="gate-box">
    <h2>Introduz o código para continuar</h2>
    <input id="gateInput" class="gate-input" type="password" inputmode="numeric" autocomplete="off" maxlength="8" />
    <button id="gateBtn" class="gate-btn">Entrar</button>
    <div id="gateErro" class="gate-erro"></div>
  </div>
</div>

<div id="app" class="app hidden">
  <div class="top">
    <h1 class="title">Duplicar Ensaio<span class="sub">Últimos 3 meses · escolhe um ensaio para usar como ponto de partida</span></h1>
    <input id="search" class="search" type="search" placeholder="Cliente, molde ou nº de teste..." autocomplete="off" />
    <div id="count" class="count"></div>
  </div>
  <div id="list" class="list"></div>
</div>

<script>
const PIN_CODE = "2017";
const gateEl = document.getElementById('gate');
const appEl = document.getElementById('app');
const gateInput = document.getElementById('gateInput');
const gateBtn = document.getElementById('gateBtn');
const gateErro = document.getElementById('gateErro');

function desbloquear() {
  gateEl.classList.add('hidden');
  appEl.classList.remove('hidden');
}

function tentar() {
  if (gateInput.value === PIN_CODE) {
    try { localStorage.setItem('smartinject_rp_unlocked', '1'); } catch (e) {}
    desbloquear();
  } else {
    gateInput.classList.add('erro');
    gateErro.textContent = 'Código incorreto.';
    gateInput.value = '';
    gateInput.focus();
  }
}

gateBtn.addEventListener('click', tentar);
gateInput.addEventListener('keydown', function (e) {
  gateInput.classList.remove('erro');
  if (e.key === 'Enter') tentar();
});

let jaDesbloqueado = false;
try { jaDesbloqueado = localStorage.getItem('smartinject_rp_unlocked') === '1'; } catch (e) {}
if (jaDesbloqueado) {
  desbloquear();
} else {
  gateInput.focus();
}
</script>

const listEl = document.getElementById('list');
const searchEl = document.getElementById('search');
const countEl = document.getElementById('count');

function formatarData(iso) {
  const d = new Date(iso.replace(' ', 'T') + 'Z');
  return d.toLocaleDateString('pt-PT', { day: '2-digit', month: '2-digit', year: 'numeric' });
}

const FORM_ID = '201333097001036';
let itensAtuais = [];

// Constrói a URL de pré-preenchimento só quando é preciso (ao carregar em
// "Duplicar"), em vez de a ter sempre pronta para todos os itens ao mesmo
// tempo — poupa muita memória em tablets mais fracos.
function construirUrl(params) {
  const partes = [];
  for (const chave in params) {
    partes.push(encodeURIComponent(chave) + '=' + encodeURIComponent(params[chave]));
  }
  return 'https://form.jotform.com/' + FORM_ID + '?' + partes.join('&');
}

function render(items) {
  itensAtuais = items;
  countEl.textContent = items.length + (items.length === 1 ? ' resultado' : ' resultados');
  if (items.length === 0) {
    listEl.innerHTML = '<div class="empty">Sem ensaios que correspondam à pesquisa.</div>';
    return;
  }
  listEl.innerHTML = items.map(function (item, idx) {
    return '<a class="card" href="#" target="_blank" rel="noopener" data-idx="' + idx + '">' +
      '<div class="card-main">' +
        '<span class="card-tag">' + item.clientcode + '</span><br/>' +
        '<span class="card-id">' + item.molde + ' &middot; Teste ' + item.testeN + '</span>' +
        '<div class="card-meta">' + item.cliente + ' &middot; ' + formatarData(item.data) + '</div>' +
      '</div>' +
      '<div class="card-cta">Duplicar</div>' +
    '</a>';
  }).join('');
}

// O href só é calculado no momento do clique (não fica todo pronto de
// antemão para os 30+ itens ao mesmo tempo) — mas continua a ser um link
// nativo (não window.open), para não correr o risco de ser bloqueado como
// pop-up nalguns browsers/tablets.
listEl.addEventListener('click', function (e) {
  const card = e.target.closest('.card');
  if (!card) return;
  const item = itensAtuais[Number(card.dataset.idx)];
  if (!item) return;
  card.href = construirUrl(item.p);
});

function normalizar(s) {
  var semAcentos = (s || '').toString().toLowerCase().normalize('NFD').split('').filter(function (ch) {
    var code = ch.codePointAt(0);
    return !(code >= 768 && code <= 879);
  }).join('');
  return semAcentos;
}

function aplicarFiltro() {
  const termo = normalizar(searchEl.value.trim());
  if (!termo) { render(DADOS); return; }
  const partes = termo.split(/\s+/);
  const filtrados = DADOS.filter(function (item) {
    const alvo = normalizar(item.cliente + ' ' + item.clientcode + ' ' + item.molde + ' ' + item.testeN);
    return partes.every(function (p) { return alvo.indexOf(p) !== -1; });
  });
  render(filtrados);
}

searchEl.addEventListener('input', aplicarFiltro);
render(DADOS);
